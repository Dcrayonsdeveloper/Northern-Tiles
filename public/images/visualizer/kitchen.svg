<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <clipPath id="floor-mask">
      <polygon points="0,380 800,380 800,600 0,600"/>
    </clipPath>
    <clipPath id="splashback-mask">
      <polygon points="50,200 450,200 450,300 50,300"/>
    </clipPath>
  </defs>
  
  <!-- Background walls -->
  <rect width="800" height="600" fill="#faf9f7"/>
  
  <!-- FLOOR AREA -->
  <g id="floor-area" data-type="floor">
    <rect x="0" y="380" width="800" height="220" fill="#e8e4e0" id="floor-placeholder"/>
  </g>
  
  <!-- Back wall -->
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  
  <!-- Upper cabinets -->
  <rect x="50" y="60" width="140" height="130" fill="#2c3e50" rx="2"/>
  <rect x="200" y="60" width="140" height="130" fill="#2c3e50" rx="2"/>
  <rect x="350" y="60" width="100" height="130" fill="#2c3e50" rx="2"/>
  <line x1="120" y1="60" x2="120" y2="190" stroke="#1a252f" stroke-width="2"/>
  <line x1="270" y1="60" x2="270" y2="190" stroke="#1a252f" stroke-width="2"/>
  
  <!-- Cabinet handles -->
  <rect x="95" y="120" width="20" height="4" fill="#c0a080" rx="1"/>
  <rect x="130" y="120" width="20" height="4" fill="#c0a080" rx="1"/>
  <rect x="245" y="120" width="20" height="4" fill="#c0a080" rx="1"/>
  <rect x="280" y="120" width="20" height="4" fill="#c0a080" rx="1"/>
  <rect x="385" y="120" width="20" height="4" fill="#c0a080" rx="1"/>
  
  <!-- Range hood -->
  <path d="M 500 60 L 650 60 L 630 140 L 520 140 Z" fill="#e0e0e0" stroke="#cccccc" stroke-width="2"/>
  <rect x="530" y="140" width="90" height="10" fill="#c0c0c0"/>
  
  <!-- Splashback area -->
  <g id="splashback-area" data-type="wall">
    <rect x="50" y="200" width="400" height="100" fill="#e8e4e0" id="splashback-placeholder"/>
  </g>
  
  <!-- Countertop -->
  <rect x="40" y="300" width="420" height="20" fill="#404040"/>
  <rect x="40" y="295" width="420" height="8" fill="#505050"/>
  
  <!-- Lower cabinets -->
  <rect x="50" y="320" width="140" height="55" fill="#2c3e50" rx="2"/>
  <rect x="200" y="320" width="140" height="55" fill="#2c3e50" rx="2"/>
  <rect x="350" y="320" width="100" height="55" fill="#2c3e50" rx="2"/>
  <rect x="95" y="345" width="20" height="4" fill="#c0a080" rx="1"/>
  <rect x="130" y="345" width="20" height="4" fill="#c0a080" rx="1"/>
  <rect x="245" y="345" width="20" height="4" fill="#c0a080" rx="1"/>
  <rect x="280" y="345" width="20" height="4" fill="#c0a080" rx="1"/>
  <rect x="385" y="345" width="20" height="4" fill="#c0a080" rx="1"/>
  
  <!-- Stove -->
  <rect x="500" y="300" width="160" height="20" fill="#303030"/>
  <rect x="500" y="320" width="160" height="55" fill="#404040"/>
  <circle cx="530" cy="310" r="12" fill="#222222" stroke="#555555" stroke-width="2"/>
  <circle cx="575" cy="310" r="15" fill="#222222" stroke="#555555" stroke-width="2"/>
  <circle cx="620" cy="310" r="15" fill="#222222" stroke="#555555" stroke-width="2"/>
  <circle cx="630" cy="310" r="12" fill="#222222" stroke="#555555" stroke-width="2"/>
  <rect x="510" y="330" width="60" height="35" fill="#1a1a1a" rx="2"/>
  <rect x="580" y="330" width="70" height="35" fill="#1a1a1a" rx="2"/>
  
  <!-- Sink -->
  <rect x="250" y="302" width="80" height="15" fill="#888888" rx="5"/>
  <ellipse cx="290" cy="307" rx="30" ry="6" fill="#666666"/>
  
  <!-- Faucet -->
  <rect x="285" y="275" width="10" height="30" fill="#c0c0c0" rx="2"/>
  <path d="M 290 275 Q 290 260, 310 260 L 310 265 Q 295 265, 295 275" fill="#c0c0c0"/>
  
  <!-- Window -->
  <rect x="550" y="80" width="200" height="100" fill="#87CEEB" stroke="#8b7355" stroke-width="6"/>
  <line x1="650" y1="80" x2="650" y2="180" stroke="#8b7355" stroke-width="4"/>
  <line x1="550" y1="130" x2="750" y2="130" stroke="#8b7355" stroke-width="4"/>
  
  <!-- Refrigerator -->
  <rect x="700" y="180" width="80" height="195" fill="#e8e8e8" stroke="#cccccc" stroke-width="2" rx="3"/>
  <rect x="705" y="185" width="70" height="100" fill="#f5f5f5" rx="2"/>
  <rect x="705" y="290" width="70" height="80" fill="#f0f0f0" rx="2"/>
  <rect x="760" y="230" width="4" height="20" fill="#c0c0c0" rx="1"/>
  <rect x="760" y="320" width="4" height="20" fill="#c0c0c0" rx="1"/>
  
  <!-- Shadow -->
  <ellipse cx="400" cy="500" rx="180" ry="15" fill="#000000" opacity="0.05"/>
</svg>
