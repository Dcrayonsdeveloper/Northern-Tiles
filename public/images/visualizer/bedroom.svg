<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <clipPath id="floor-mask">
      <polygon points="0,380 800,380 800,600 0,600"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f7f5"/>
  
  <!-- FLOOR AREA -->
  <g id="floor-area" data-type="floor">
    <rect x="0" y="380" width="800" height="220" fill="#e8e4e0" id="floor-placeholder"/>
  </g>
  
  <!-- Back wall -->
  <rect x="0" y="0" width="800" height="380" fill="#f0ece6"/>
  
  <!-- Accent wall behind bed -->
  <rect x="150" y="50" width="500" height="320" fill="#4a5568"/>
  
  <!-- Wall trim -->
  <rect x="0" y="370" width="800" height="10" fill="#d4cfc9"/>
  
  <!-- Headboard -->
  <rect x="200" y="180" width="400" height="120" fill="#8b7355" rx="5"/>
  <rect x="210" y="190" width="380" height="100" fill="#a08060" rx="3"/>
  <!-- Tufted pattern -->
  <circle cx="280" cy="230" r="5" fill="#8b7355"/>
  <circle cx="340" cy="230" r="5" fill="#8b7355"/>
  <circle cx="400" cy="230" r="5" fill="#8b7355"/>
  <circle cx="460" cy="230" r="5" fill="#8b7355"/>
  <circle cx="520" cy="230" r="5" fill="#8b7355"/>
  <circle cx="280" cy="270" r="5" fill="#8b7355"/>
  <circle cx="340" cy="270" r="5" fill="#8b7355"/>
  <circle cx="400" cy="270" r="5" fill="#8b7355"/>
  <circle cx="460" cy="270" r="5" fill="#8b7355"/>
  <circle cx="520" cy="270" r="5" fill="#8b7355"/>
  
  <!-- Bed -->
  <rect x="180" y="300" width="440" height="150" fill="#ffffff" rx="5"/>
  <rect x="190" y="310" width="420" height="130" fill="#f5f0e8" rx="3"/>
  
  <!-- Pillows -->
  <rect x="210" y="320" width="120" height="60" fill="#ffffff" rx="10"/>
  <rect x="470" y="320" width="120" height="60" fill="#ffffff" rx="10"/>
  
  <!-- Blanket fold -->
  <rect x="190" y="400" width="420" height="40" fill="#d4c8b8" rx="3"/>
  
  <!-- Left nightstand -->
  <rect x="60" y="320" width="100" height="80" fill="#5a4a3a" rx="3"/>
  <rect x="65" y="325" width="90" height="35" fill="#4a3a2a" rx="2"/>
  <rect x="65" y="365" width="90" height="30" fill="#4a3a2a" rx="2"/>
  <circle cx="110" cy="342" r="4" fill="#c0a080"/>
  <circle cx="110" cy="380" r="4" fill="#c0a080"/>
  
  <!-- Right nightstand -->
  <rect x="640" y="320" width="100" height="80" fill="#5a4a3a" rx="3"/>
  <rect x="645" y="325" width="90" height="35" fill="#4a3a2a" rx="2"/>
  <rect x="645" y="365" width="90" height="30" fill="#4a3a2a" rx="2"/>
  <circle cx="690" cy="342" r="4" fill="#c0a080"/>
  <circle cx="690" cy="380" r="4" fill="#c0a080"/>
  
  <!-- Left lamp -->
  <rect x="100" y="270" width="20" height="50" fill="#c0a080"/>
  <ellipse cx="110" cy="270" rx="25" ry="15" fill="#fff8e7" stroke="#e0d5c0" stroke-width="2"/>
  
  <!-- Right lamp -->
  <rect x="680" y="270" width="20" height="50" fill="#c0a080"/>
  <ellipse cx="690" cy="270" rx="25" ry="15" fill="#fff8e7" stroke="#e0d5c0" stroke-width="2"/>
  
  <!-- Window on left -->
  <rect x="20" y="80" width="100" height="180" fill="#87CEEB" stroke="#8b7355" stroke-width="6"/>
  <line x1="70" y1="80" x2="70" y2="260" stroke="#8b7355" stroke-width="3"/>
  <line x1="20" y1="170" x2="120" y2="170" stroke="#8b7355" stroke-width="3"/>
  
  <!-- Curtain -->
  <rect x="125" y="70" width="20" height="200" fill="#d4c8b8"/>
  
  <!-- Wall art above bed -->
  <rect x="330" y="80" width="140" height="90" fill="#ffffff" stroke="#c0a080" stroke-width="3"/>
  <rect x="340" y="90" width="120" height="70" fill="#e8e4e0"/>
  <circle cx="400" cy="115" r="20" fill="#d4a574"/>
  <path d="M 350 160 L 380 130 L 420 150 L 450 120" stroke="#b8a090" stroke-width="3" fill="none"/>
  
  <!-- Bedroom rug -->
  <ellipse cx="400" cy="520" rx="200" ry="60" fill="#c8b8a0" opacity="0.5"/>
  
  <!-- Shadow under bed -->
  <ellipse cx="400" cy="455" rx="220" ry="10" fill="#000000" opacity="0.08"/>
</svg>
