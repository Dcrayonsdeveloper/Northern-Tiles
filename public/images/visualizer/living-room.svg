<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <clipPath id="floor-mask">
      <polygon points="0,360 800,360 800,600 0,600"/>
    </clipPath>
    <linearGradient id="window-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff5e6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafaf8"/>
  
  <!-- FLOOR AREA -->
  <g id="floor-area" data-type="floor">
    <rect x="0" y="360" width="800" height="240" fill="#e8e4e0" id="floor-placeholder"/>
  </g>
  
  <!-- Walls -->
  <rect x="0" y="0" width="800" height="360" fill="#f5f3f0"/>
  
  <!-- Wall trim/baseboard -->
  <rect x="0" y="350" width="800" height="10" fill="#e0dcd6"/>
  
  <!-- Large window -->
  <rect x="250" y="60" width="300" height="220" fill="#87CEEB" stroke="#8b7355" stroke-width="8"/>
  <line x1="325" y1="60" x2="325" y2="280" stroke="#8b7355" stroke-width="4"/>
  <line x1="400" y1="60" x2="400" y2="280" stroke="#8b7355" stroke-width="4"/>
  <line x1="475" y1="60" x2="475" y2="280" stroke="#8b7355" stroke-width="4"/>
  <line x1="250" y1="170" x2="550" y2="170" stroke="#8b7355" stroke-width="4"/>
  
  <!-- Window light effect on floor -->
  <polygon points="270,360 530,360 600,600 200,600" fill="url(#window-light)"/>
  
  <!-- Curtains -->
  <rect x="230" y="50" width="25" height="240" fill="#d4c8b8"/>
  <rect x="545" y="50" width="25" height="240" fill="#d4c8b8"/>
  
  <!-- Sofa -->
  <rect x="80" y="380" width="280" height="100" fill="#4a5568" rx="10"/>
  <rect x="90" y="370" width="260" height="20" fill="#3d4654" rx="8"/>
  <rect x="70" y="390" width="30" height="80" fill="#3d4654" rx="5"/>
  <rect x="340" y="390" width="30" height="80" fill="#3d4654" rx="5"/>
  <!-- Cushions -->
  <rect x="100" y="400" width="70" height="50" fill="#5a6678" rx="8"/>
  <rect x="180" y="400" width="70" height="50" fill="#5a6678" rx="8"/>
  <rect x="260" y="400" width="70" height="50" fill="#5a6678" rx="8"/>
  
  <!-- Coffee table -->
  <rect x="160" y="500" width="180" height="60" fill="#8b7355" rx="3"/>
  <rect x="165" y="505" width="170" height="50" fill="#a0896b" rx="2"/>
  <!-- Table legs -->
  <rect x="170" y="555" width="8" height="20" fill="#5a4a3a"/>
  <rect x="322" y="555" width="8" height="20" fill="#5a4a3a"/>
  
  <!-- Side table -->
  <ellipse cx="420" cy="460" rx="35" ry="20" fill="#8b7355"/>
  <rect x="415" y="460" width="10" height="50" fill="#5a4a3a"/>
  
  <!-- Lamp on side table -->
  <rect x="412" y="410" width="16" height="50" fill="#c0a080"/>
  <path d="M 400 410 Q 420 380, 440 410 Z" fill="#fff8e7" stroke="#e0d5c0" stroke-width="2"/>
  
  <!-- Plant -->
  <rect x="640" y="450" width="50" height="60" fill="#8b7355" rx="3"/>
  <ellipse cx="665" cy="445" rx="40" ry="15" fill="#228b22"/>
  <ellipse cx="650" cy="430" rx="30" ry="20" fill="#2da02d"/>
  <ellipse cx="680" cy="425" rx="25" ry="18" fill="#32b232"/>
  <ellipse cx="665" cy="410" rx="20" ry="15" fill="#38c238"/>
  
  <!-- Wall art -->
  <rect x="620" y="100" width="120" height="160" fill="#ffffff" stroke="#8b7355" stroke-width="4"/>
  <rect x="635" y="115" width="90" height="130" fill="#d4e5f7"/>
  <circle cx="680" cy="160" r="25" fill="#f0c040"/>
  <path d="M 635 245 Q 680 180, 725 245" fill="#5a8f5a"/>
  <path d="M 650 245 Q 690 200, 725 245" fill="#4a7f4a"/>
  
  <!-- Small rug under coffee table -->
  <ellipse cx="250" cy="540" rx="120" ry="40" fill="#b8a090" opacity="0.6"/>
  
  <!-- Floor shadow from sofa -->
  <ellipse cx="220" cy="490" rx="160" ry="12" fill="#000000" opacity="0.05"/>
</svg>
