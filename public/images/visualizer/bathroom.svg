<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <clipPath id="floor-mask">
      <polygon points="0,350 800,350 800,600 0,600"/>
    </clipPath>
    <clipPath id="wall-mask">
      <polygon points="0,80 400,80 400,350 0,350"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f5f5f5"/>
  
  <!-- FLOOR AREA -->
  <g id="floor-area" data-type="floor">
    <rect x="0" y="350" width="800" height="250" fill="#e8e4e0" id="floor-placeholder"/>
  </g>
  
  <!-- LEFT WALL -->
  <rect x="0" y="80" width="400" height="270" fill="#ffffff"/>
  
  <!-- RIGHT WALL -->
  <rect x="400" y="80" width="400" height="270" fill="#fafafa"/>
  
  <!-- Ceiling -->
  <rect x="0" y="0" width="800" height="80" fill="#ffffff"/>
  
  <!-- Wall trim -->
  <rect x="0" y="340" width="800" height="10" fill="#d4cfc9"/>
  
  <!-- Window on right wall -->
  <rect x="500" y="120" width="180" height="160" fill="#87CEEB" stroke="#8b7355" stroke-width="6"/>
  <line x1="590" y1="120" x2="590" y2="280" stroke="#8b7355" stroke-width="4"/>
  <line x1="500" y1="200" x2="680" y2="200" stroke="#8b7355" stroke-width="4"/>
  
  <!-- Vanity cabinet -->
  <rect x="40" y="200" width="280" height="140" fill="#5a4a3a" rx="2"/>
  <rect x="50" y="210" width="120" height="120" fill="#4a3a2a" rx="2"/>
  <rect x="190" y="210" width="120" height="120" fill="#4a3a2a" rx="2"/>
  <circle cx="110" cy="270" r="8" fill="#c0a080"/>
  <circle cx="250" cy="270" r="8" fill="#c0a080"/>
  
  <!-- Sink basin -->
  <ellipse cx="180" cy="190" rx="80" ry="25" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>
  <ellipse cx="180" cy="190" rx="40" ry="12" fill="#e8e8e8"/>
  
  <!-- Faucet -->
  <rect x="172" y="150" width="16" height="40" fill="#c0c0c0" rx="3"/>
  <path d="M 180 150 Q 180 135, 200 135 L 200 140 Q 185 140, 185 150" fill="#c0c0c0"/>
  
  <!-- Mirror -->
  <rect x="80" y="90" width="200" height="100" fill="#a8d4e6" stroke="#8b7355" stroke-width="4" rx="2"/>
  <rect x="90" y="100" width="180" height="80" fill="#c8e4f6" opacity="0.5"/>
  
  <!-- Toilet -->
  <ellipse cx="650" cy="420" rx="45" ry="55" fill="#ffffff" stroke="#dddddd" stroke-width="2"/>
  <rect x="615" y="350" width="70" height="30" fill="#ffffff" stroke="#dddddd" stroke-width="2" rx="5"/>
  <rect x="625" y="320" width="50" height="35" fill="#f0f0f0" stroke="#dddddd" stroke-width="2" rx="3"/>
  
  <!-- Towel rack -->
  <rect x="720" y="180" width="8" height="120" fill="#c0c0c0"/>
  <rect x="715" y="175" width="18" height="8" fill="#c0c0c0" rx="2"/>
  <rect x="715" y="297" width="18" height="8" fill="#c0c0c0" rx="2"/>
  <rect x="710" y="200" width="30" height="60" fill="#ffffff" opacity="0.9"/>
  
  <!-- Bath mat area indicator -->
  <rect x="350" y="450" width="120" height="80" fill="#d4cfc9" opacity="0.3" rx="5"/>
  
  <!-- Shadow under vanity -->
  <ellipse cx="180" cy="345" rx="150" ry="8" fill="#00000" opacity="0.1"/>
</svg>
