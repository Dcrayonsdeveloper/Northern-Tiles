<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 44" width="110" height="44" role="img" aria-label="Stripe">
  <title>Stripe</title>
  <rect width="110" height="44" rx="7" fill="#635BFF"/>
  <!-- Set as text rather than traced paths: the hand-built outlines rendered
       as a clipped "strip". A system-font wordmark is legible at every size
       and needs no font file. -->
  <text x="55" y="29"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="19"
        font-weight="700"
        letter-spacing="-0.6"
        fill="#ffffff">stripe</text>
</svg>
